name: Source-owned tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tools:
    name: Node synthetic tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: RPX parser tests (synthetic fixture)
        working-directory: tools/rpxinfo
        run: npm test
      - name: PPC decoder and codegen tests (synthetic fixture)
        working-directory: tools/ppcx
        run: npm test

  compiled-conformance:
    name: Compiled ISA and loader conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify host C compiler
        run: cc --version
      - name: Execute generated PowerPC C and compare with independent oracle
        env:
          PPCX_CC: cc
        run: node tests/isa/run.js
      - name: Test image parser and compiled guest-memory loader
        env:
          PPCX_CC: cc
        run: node tests/loader/run.js
      - name: Verify mapped guest memory access and deterministic fault behavior
        env:
          PPCX_CC: cc
        run: node tests/mem/run.js
      - name: Verify deterministic end-to-end synthetic RPX headless boot checkpoints
        env:
          PPCX_CC: cc
        run: node tests/boot/run.js

  coreinit-hle:
    name: Synthetic Cafe OS HLE tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact-name coreinit HLE contract tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/runtime/include \
            src/runtime/src/ppcx_hle.c tests/hle/test_hle.c -o /tmp/ppcx-hle-test
          /tmp/ppcx-hle-test

  c-syntax:
    name: Runtime C syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile original runtime source without any game binaries
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/runtime/include -fsyntax-only src/runtime/src/main.c src/runtime/src/ppcx_runtime.c src/runtime/src/ppcx_image.c src/runtime/src/ppcx_hle.c src/runtime/src/ppcx_mem.c

# No Nintendo files, game dumps, generated derived code, assets or keys are used or uploaded.
